<style>
/* ============================================================
   Tema industrial 5S — limpio, profesional, orientado a planta
   ============================================================ */
:root{
  --bg:#0f1419;
  --panel:#1a2129;
  --panel-2:#222b35;
  --line:#2d3845;
  --txt:#e6edf3;
  --txt-dim:#9aa7b4;
  --accent:#2e7d32;      /* verde industrial */
  --accent-2:#1565c0;    /* azul */
  --verde:#2e7d32;
  --amarillo:#f9a825;
  --rojo:#c62828;
  --gris:#546e7a;
  --radius:10px;
  --shadow:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  background:var(--bg); color:var(--txt); font-size:14px;
}
#app{display:flex; min-height:100vh}

/* -------- Sidebar -------- */
.sidebar{
  width:230px; background:var(--panel); border-right:1px solid var(--line);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.brand{display:flex; align-items:center; gap:10px; padding:18px 16px; border-bottom:1px solid var(--line)}
.brand-logo{
  width:40px;height:40px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff;
}
.brand-text{display:flex;flex-direction:column;line-height:1.2}
.brand-text strong{font-size:13px}
.brand-text span{font-size:11px;color:var(--txt-dim)}
.menu{display:flex;flex-direction:column;padding:10px 8px;gap:2px;flex:1}
.nav-item{
  color:var(--txt-dim); text-decoration:none; padding:10px 12px; border-radius:8px;
  font-size:13.5px; transition:.15s; white-space:nowrap;
}
.nav-item:hover{background:var(--panel-2); color:var(--txt)}
.nav-item.active{background:var(--accent); color:#fff; font-weight:600}
.sidebar-foot{padding:12px 16px;color:var(--txt-dim);font-size:11px;border-top:1px solid var(--line)}

/* -------- Main / Topbar -------- */
.main{flex:1; display:flex; flex-direction:column; min-width:0}
.topbar{
  background:var(--panel); border-bottom:1px solid var(--line);
  padding:12px 18px; position:sticky; top:0; z-index:5;
}
.filtros{display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end}
.filtros label{display:flex;flex-direction:column;font-size:11px;color:var(--txt-dim);gap:3px}
.filtros input,.filtros select{
  background:var(--panel-2); border:1px solid var(--line); color:var(--txt);
  padding:7px 9px; border-radius:7px; font-size:13px; min-width:120px;
}
.btn{
  background:var(--panel-2); border:1px solid var(--line); color:var(--txt);
  padding:8px 14px; border-radius:7px; cursor:pointer; font-size:13px;
}
.btn:hover{background:var(--line)}
.btn-primary{background:var(--accent-2); border-color:var(--accent-2); color:#fff}
.btn-primary:hover{filter:brightness(1.1)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--accent-2);color:#fff;padding:3px 10px;border-radius:20px;font-size:11px}

/* -------- Views -------- */
.view{padding:20px; display:flex; flex-direction:column; gap:18px}
.view-title{font-size:20px;font-weight:700;margin-bottom:2px}
.view-sub{color:var(--txt-dim);font-size:13px;margin-bottom:6px}
.loader{color:var(--txt-dim);padding:40px;text-align:center}

/* -------- KPI cards -------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.kpi{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; box-shadow:var(--shadow); cursor:default; position:relative;
}
.kpi.clickable{cursor:pointer; transition:.15s}
.kpi.clickable:hover{border-color:var(--accent-2); transform:translateY(-2px)}
.kpi .k-label{font-size:12px;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.4px}
.kpi .k-value{font-size:28px;font-weight:800;margin-top:6px}
.kpi .k-sub{font-size:12px;margin-top:4px;color:var(--txt-dim)}
.kpi .k-sub.up{color:#66bb6a}.kpi .k-sub.down{color:#ef5350}
.kpi.border-rojo{border-left:4px solid var(--rojo)}
.kpi.border-amarillo{border-left:4px solid var(--amarillo)}
.kpi.border-verde{border-left:4px solid var(--verde)}

/* -------- Grid de gráficos -------- */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; box-shadow:var(--shadow);
}
.card h3{font-size:14px;margin-bottom:12px;font-weight:600}
.card .chart-wrap{position:relative;height:280px}

/* -------- Tablas -------- */
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--panel-2);position:sticky;top:0;cursor:pointer;user-select:none}
th:hover{color:#fff}
tbody tr:hover{background:var(--panel-2)}
.row-click{cursor:pointer}

/* -------- Badges estado / semáforo -------- */
.badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;display:inline-block}
.badge.Corregido,.badge.verde{background:rgba(46,125,50,.2);color:#81c784}
.badge.En{background:rgba(21,101,192,.2);color:#64b5f6}
.badge.Pendiente,.badge.gris{background:rgba(84,110,122,.25);color:#b0bec5}
.badge.Vencido,.badge.rojo{background:rgba(198,40,40,.2);color:#ef9a9a}
.badge.amarillo{background:rgba(249,168,37,.2);color:#ffd54f}
.badge.azul{background:rgba(21,101,192,.2);color:#64b5f6}
.badge.morado{background:rgba(106,27,154,.25);color:#ce93d8}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.dot.verde{background:var(--verde)}.dot.amarillo{background:var(--amarillo)}
.dot.rojo{background:var(--rojo)}.dot.gris{background:var(--gris)}

/* -------- Mapa 5S tarjetas -------- */
.mapa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.mod-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;cursor:pointer;transition:.15s;border-top:5px solid var(--gris)
}
.mod-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.mod-card.verde{border-top-color:var(--verde)}
.mod-card.amarillo{border-top-color:var(--amarillo)}
.mod-card.rojo{border-top-color:var(--rojo)}
.mod-card .m-name{font-size:16px;font-weight:700}
.mod-card .m-cumpl{font-size:30px;font-weight:800;margin:6px 0}
.mod-card .m-row{display:flex;justify-content:space-between;font-size:12px;color:var(--txt-dim);margin-top:4px}

/* -------- Modal -------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50}
.modal.hidden{display:none}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  max-width:820px;width:92%;max-height:88vh;overflow:auto;padding:24px;position:relative}
.modal-close{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--txt-dim);font-size:18px;cursor:pointer}
.modal-close:hover{color:#fff}

/* -------- Misc -------- */
.muted{color:var(--txt-dim)}
.center{text-align:center}
.empty{padding:30px;text-align:center;color:var(--txt-dim);font-style:italic}
.search-box{background:var(--panel-2);border:1px solid var(--line);color:var(--txt);
  padding:8px 12px;border-radius:7px;font-size:13px;width:260px;margin-bottom:12px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}

/* -------- Calendario -------- */
.cal-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-mes{font-size:18px;font-weight:700;min-width:180px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-size:11px;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.5px;padding:6px 0;font-weight:600}
.cal-cell{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  min-height:104px;padding:6px;display:flex;flex-direction:column;gap:4px;overflow:hidden;
}
.cal-cell.vacia{background:transparent;border:none}
.cal-cell.hoy{border-color:var(--accent-2);box-shadow:inset 0 0 0 1px var(--accent-2)}
.cal-num{font-size:12px;color:var(--txt-dim);font-weight:600}
.cal-cell.hoy .cal-num{color:#64b5f6}
.cal-ev{
  font-size:10.5px;padding:3px 5px;border-radius:5px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;border-left:3px solid rgba(255,255,255,.4);
}
.cal-ev:hover{filter:brightness(1.15)}
.cal-ev.azul{background:#1565c0}.cal-ev.verde{background:#2e7d32}
.cal-ev.rojo{background:#c62828}.cal-ev.amarillo{background:#f9a825;color:#1a2129}
.cal-ev.gris{background:#546e7a}.cal-ev.morado{background:#6a1b9a}
.cal-mas{font-size:10px;color:var(--txt-dim);cursor:pointer}
.cal-leyenda{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11px;color:var(--txt-dim)}
.cal-leyenda span{display:flex;align-items:center;gap:5px}
.leg-dot{width:10px;height:10px;border-radius:3px;display:inline-block}

/* -------- Agenda -------- */
.agenda-dia{margin-bottom:18px}
.agenda-fecha{font-size:14px;font-weight:700;color:var(--txt);margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.agenda-item{
  display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);
  border-left:4px solid var(--gris);border-radius:8px;padding:10px 14px;margin-bottom:6px;cursor:pointer;transition:.15s;
}
.agenda-item:hover{transform:translateX(3px);border-left-color:var(--accent-2)}
.agenda-item.azul{border-left-color:#1565c0}.agenda-item.verde{border-left-color:#2e7d32}
.agenda-item.rojo{border-left-color:#c62828}.agenda-item.amarillo{border-left-color:#f9a825}
.agenda-item.gris{border-left-color:#546e7a}.agenda-item.morado{border-left-color:#6a1b9a}
.agenda-hora{font-size:16px;font-weight:700;min-width:52px}
.agenda-info{flex:1;min-width:0}
.agenda-info .a-ruta{font-weight:600}
.agenda-info .a-meta{font-size:12px;color:var(--txt-dim)}

/* -------- Breadcrumbs (migas de pan) -------- */
.bc{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.bc-item{color:var(--accent-2);text-decoration:none;cursor:pointer}
.bc-item:hover{text-decoration:underline}
.bc-sep{color:var(--txt-dim)}
.bc-actual{color:var(--txt-dim);font-weight:600}

/* -------- Ficha de hallazgo (tabs, origen) -------- */
.ficha-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ficha-meta{text-align:right;font-size:12px;line-height:1.6}
.ficha-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.ftab{background:none;border:none;color:var(--txt-dim);padding:9px 14px;cursor:pointer;font-size:13px;border-bottom:2px solid transparent}
.ftab:hover{color:var(--txt)}
.ftab.active{color:#fff;border-bottom-color:var(--accent-2);font-weight:600}
.card-origen{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:16px}
.co-title{font-weight:700;margin-bottom:10px}
.co-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px 16px;margin-bottom:12px}

/* -------- Chips de hallazgos (en detalle inspección) -------- */
.hall-list{display:flex;flex-direction:column;gap:6px}
.hall-chip{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--accent-2);
  border-radius:8px;padding:9px 12px;cursor:pointer;transition:.15s;font-size:13px}
.hall-chip:hover{transform:translateX(3px);background:var(--line)}

/* -------- Galería de evidencias -------- */
.ev-grupo{margin-bottom:16px}
.ev-tipo{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--txt-dim);font-weight:600;margin-bottom:8px}
.ev-thumbs{display:flex;flex-wrap:wrap;gap:10px}
.ev-thumb{width:120px;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--txt-dim);
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px;font-size:11px;text-align:center}
.ev-thumb img{width:100%;height:84px;object-fit:cover;border-radius:5px;background:var(--line)}
.ev-thumb:hover{border-color:var(--accent-2)}
.ev-thumb.ev-sinimg img{display:none}

/* -------- Acciones -------- */
.acc-item{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.acc-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}

/* -------- Timeline / Historial -------- */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;margin-bottom:16px}
.tl-dot{position:absolute;left:-20px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent-2);border:2px solid var(--panel)}
.tl-fecha{font-size:11px;color:var(--txt-dim)}
.tl-body{font-size:13px}

/* -------- Recurrencia (candidatos a estandarizar) -------- */
.rec-leyenda{display:flex;flex-wrap:wrap;gap:14px;margin:4px 0 12px;font-size:11px;color:var(--txt-dim)}
.rec-leyenda span{display:flex;align-items:center;gap:5px}
.rec-item{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:10px}
.rec-item-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rec-oc{font-size:18px;font-weight:800;color:var(--txt)}
.rec-desc{font-size:13.5px;font-weight:600}
.rec-item-meta{font-size:11.5px;color:var(--txt-dim);margin-top:6px}
.rec-reco{font-size:12.5px;color:#ffd54f;margin-top:8px}
.rec-ids{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.rec-id{font-size:11px;background:var(--line);color:var(--accent-2);padding:2px 8px;border-radius:12px;text-decoration:none}
.rec-id:hover{background:var(--accent-2);color:#fff}

/* -------- Kanban -------- */
.seg-toggle{display:flex;gap:6px}
.kb-board{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.kb-col{flex:1 0 220px;max-width:300px;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column}
.kb-col-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-weight:700;font-size:13px;border-radius:10px 10px 0 0;color:#fff}
.kb-col-head.rojo{background:#c62828}.kb-col-head.azul{background:#1565c0}
.kb-col-head.verde{background:#2e7d32}.kb-col-head.gris{background:#546e7a}.kb-col-head.morado{background:#6a1b9a}
.kb-count{background:rgba(255,255,255,.25);border-radius:12px;padding:1px 8px;font-size:12px}
.kb-col-body{padding:8px;display:flex;flex-direction:column;gap:8px;min-height:80px;transition:background .15s}
.kb-col-body.kb-over{background:var(--panel-2);outline:2px dashed var(--accent-2);outline-offset:-4px}
.kb-vacio{color:var(--txt-dim);text-align:center;font-size:12px;padding:12px}
.kb-card{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--accent-2);border-radius:8px;padding:9px 10px;cursor:pointer;transition:.12s}
.kb-card:hover{border-color:var(--accent-2);transform:translateY(-1px)}
.kb-card.kb-drag{opacity:.5}
.kb-card-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:4px}
.kb-card-desc{font-size:12.5px;line-height:1.3;margin-bottom:5px}
.kb-card-meta{font-size:11px;color:var(--txt-dim)}
.kb-card-acts{display:flex;justify-content:space-between;margin-top:7px}
.kb-mover{background:var(--line);border:none;color:var(--txt);width:26px;height:22px;border-radius:5px;cursor:pointer;font-size:14px;line-height:1}
.kb-mover:hover{background:var(--accent-2);color:#fff}
.kb-mover:disabled{opacity:.4;cursor:default}

/* -------- Responsive -------- */
@media (max-width:1100px){
  .grid-2,.grid-3{grid-template-columns:1fr}
  .co-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:700px){
  .cal-cell{min-height:72px}
  .cal-ev{font-size:9px}
  .co-grid{grid-template-columns:1fr}
}
@media (max-width:820px){
  .sidebar{width:60px}
  .brand-text,.sidebar-foot{display:none}
  .nav-item{font-size:0;text-align:center;padding:12px 0}
  .nav-item::first-letter{font-size:18px}
}
</style>
