<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>{{APP_TITLE}}</title>
  <!-- Chart.js + plugin matrix (heatmaps) por CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@2.0.1/dist/chartjs-chart-matrix.min.js"></script>
  {{CSS}}
</head>
<body>
  <div id="app">

    <!-- ====================== SIDEBAR ====================== -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">5S</div>
        <div class="brand-text">
          <strong>{{APP_TITLE}}</strong>
          <span>{{APP_SUBTITLE}}</span>
        </div>
      </div>
      <nav class="menu">
        <a href="javascript:void(0)" class="nav-item active" data-view="dashboard">📊 Dashboard</a>
        <a href="javascript:void(0)" class="nav-item" data-view="inspecciones">🔎 Inspecciones</a>
        <a href="javascript:void(0)" class="nav-item" data-view="calendario">📅 Calendario</a>
        <a href="javascript:void(0)" class="nav-item" data-view="agenda">📌 Agenda</a>
        <a href="javascript:void(0)" class="nav-item" data-view="programacion">🗓️ Programación</a>
        <a href="javascript:void(0)" class="nav-item" data-view="cumplimiento">✅ Cumplimiento 5S</a>
        <a href="javascript:void(0)" class="nav-item" data-view="criterios">🔍 Criterios</a>
        <a href="javascript:void(0)" class="nav-item" data-view="hallazgos">⚠️ Hallazgos</a>
        <a href="javascript:void(0)" class="nav-item" data-view="estandarizacion">🏭 Estandarización</a>
        <a href="javascript:void(0)" class="nav-item" data-view="mapa">🗺️ Mapa 5S</a>
        <a href="javascript:void(0)" class="nav-item" data-view="tendencias">📈 Tendencias</a>
        <a href="javascript:void(0)" class="nav-item" data-view="catalogos">📇 Catálogos</a>
      </nav>
      <div class="sidebar-foot">v{{VERSION}}</div>
    </aside>

    <!-- ====================== MAIN ====================== -->
    <main class="main">

      <!-- Barra de filtros globales -->
      <header class="topbar">
        <div class="filtros">
          <label>Desde <input type="date" id="f-desde"></label>
          <label>Hasta <input type="date" id="f-hasta"></label>
          <label>Área <select id="f-area"><option value="">Todas</option></select></label>
          <label>Módulo <select id="f-modulo"><option value="">Todos</option></select></label>
          <label>Ruta <select id="f-ruta"><option value="">Todas</option></select></label>
          <label>Responsable <select id="f-responsable"><option value="">Todos</option></select></label>
          <label>Estado <select id="f-estado"><option value="">Todos</option></select></label>
          <button id="btn-aplicar" class="btn btn-primary">Aplicar</button>
          <button id="btn-limpiar" class="btn">🧹 Limpiar</button>
        </div>
        <div id="filtros-activos" class="chips"></div>
      </header>

      <!-- Contenedor dinámico de vistas -->
      <section id="view" class="view">
        <div class="loader">Cargando…</div>
      </section>

      <!-- Capturador de errores en SU PROPIO bloque <script>: si el script
           principal falla al PARSEAR, este (que ya se ejecutó) lo detecta y
           lo muestra en pantalla. -->
      <script>
        window.addEventListener('error', function (ev) {
          var v = document.getElementById('view');
          if (v) v.innerHTML = '<div style="padding:24px;color:#c62828;font-family:monospace;white-space:pre-wrap">ERROR: ' +
            (ev.message || '') + '\n' + (ev.filename || '') + ' línea ' + (ev.lineno || '?') + ' col ' + (ev.colno || '?') + '</div>';
        });
      </script>
    </main>
  </div>

  <!-- Modal reutilizable (detalle de inspección / hallazgo) -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button class="modal-close" id="modal-close">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  {{JS}}
</body>
</html>
